<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhantomShell C2 v5.2</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
/* ═══════════════════════════════════════════════════════════════
   CSS THEME
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-primary:#1a1a2e;--bg-secondary:#16213e;--bg-tertiary:#0f3460;
  --accent:#e94560;--accent-purple:#533483;
  --text:#eee;--text-dim:#999;--text-muted:#666;
  --green:#00ff41;--red:#ff0040;--yellow:#ffd700;--blue:#4da6ff;
  --border:#2a2a4a;--card-shadow:0 4px 16px rgba(0,0,0,0.3);
  --radius:8px;--transition:0.2s ease;
}
html,body{height:100%;font-family:'Segoe UI','Inter',sans-serif;background:var(--bg-primary);color:var(--text);overflow:hidden}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg-primary)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Layout */
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:220px;min-width:220px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width var(--transition),min-width var(--transition)}
.sidebar.collapsed{width:56px;min-width:56px}
.sidebar.collapsed .nav-label,.sidebar.collapsed .sidebar-brand span,.sidebar.collapsed .sidebar-footer span{display:none}
.sidebar.collapsed .sidebar-brand{justify-content:center;padding:16px 8px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.sidebar-brand img{width:32px;height:32px}
.sidebar-brand span{font-weight:700;font-size:14px;white-space:nowrap;color:var(--accent)}
.sidebar-toggle{position:absolute;top:14px;right:-12px;width:24px;height:24px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;z-index:10;transition:background var(--transition)}
.sidebar-toggle:hover{background:var(--accent);color:#fff}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;color:var(--text-dim);transition:all var(--transition);border-left:3px solid transparent;font-size:13px;white-space:nowrap}
.nav-item:hover{background:rgba(233,69,96,0.08);color:var(--text)}
.nav-item.active{color:var(--accent);background:rgba(233,69,96,0.12);border-left-color:var(--accent)}
.nav-icon{width:18px;text-align:center;flex-shrink:0;font-size:15px}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
.sidebar-footer .conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.conn-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn-dot.disconnected{background:var(--red);box-shadow:0 0 6px var(--red)}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:16px}
.topbar-actions button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:4px;transition:color var(--transition)}
.topbar-actions button:hover{color:var(--accent)}
.kbd{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10px;color:var(--text-dim);font-family:monospace;margin-left:4px}
.content{flex:1;overflow-y:auto;padding:24px}

/* Cards & Stats */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--card-shadow);transition:transform var(--transition),border-color var(--transition)}
.stat-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat-card .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}
.stat-card .value{font-size:28px;font-weight:700;margin:6px 0 0}
.stat-card .value.green{color:var(--green)}.stat-card .value.red{color:var(--red)}.stat-card .value.yellow{color:var(--yellow)}.stat-card .value.blue{color:var(--blue)}.stat-card .value.accent{color:var(--accent)}

/* Panels */
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--card-shadow);margin-bottom:20px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.panel-body{padding:16px 18px}
.panel-body.no-pad{padding:0}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 14px;background:var(--bg-primary);color:var(--text-dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.5px;position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
tbody tr:hover{background:rgba(233,69,96,0.06)}
tbody tr.selected{background:rgba(233,69,96,0.12)}
tbody td{padding:9px 14px;color:var(--text-dim)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.alive{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.dead{background:var(--red);box-shadow:0 0 4px var(--red)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:all var(--transition);font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#c7374e}
.btn-secondary{background:var(--bg-tertiary);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#cc0033}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600}
.form-control{width:100%;padding:8px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:13px;font-family:inherit;transition:border-color var(--transition)}
.form-control:focus{outline:none;border-color:var(--accent)}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text-dim)}
.checkbox-label input{accent-color:var(--accent)}

/* Terminal */
.terminal{background:#0a0a14;border-radius:0 0 var(--radius) var(--radius);font-family:'JetBrains Mono','Fira Code',monospace;font-size:12.5px;line-height:1.6;position:relative}
.terminal-output{padding:14px;max-height:360px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:var(--green)}
.terminal-output .cmd{color:var(--text)}
.terminal-output .prompt-text{color:var(--accent)}
.terminal-output .error{color:var(--red)}
.terminal-output .info{color:var(--blue)}
.terminal-input-row{display:flex;align-items:center;padding:6px 14px 10px;border-top:1px solid #1a1a2e}
.terminal-input-row .prompt-text{color:var(--accent);margin-right:8px;user-select:none}
.terminal-input{flex:1;background:none;border:none;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;caret-color:var(--accent)}

/* Timeline */
.timeline{list-style:none}
.timeline li{position:relative;padding:8px 0 8px 24px;border-left:2px solid var(--border);font-size:12px;color:var(--text-dim)}
.timeline li::before{content:'';position:absolute;left:-5px;top:12px;width:8px;height:8px;background:var(--accent);border-radius:50%}
.timeline li .time{color:var(--text-muted);font-size:10px;margin-left:8px}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 18px}
.tab{padding:10px 16px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--transition)}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Network canvas */
#network-canvas{width:100%;height:500px;background:var(--bg-primary);border-radius:var(--radius);cursor:grab;display:block}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-green{background:rgba(0,255,65,0.15);color:var(--green)}
.badge-red{background:rgba(255,0,64,0.15);color:var(--red)}
.badge-yellow{background:rgba(255,215,0,0.15);color:var(--yellow)}
.badge-blue{background:rgba(77,166,255,0.15);color:var(--blue)}
.badge-purple{background:rgba(83,52,131,0.25);color:#a67ee6}

/* Code block */
.code-block{background:#0a0a14;border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px;line-height:1.5;color:var(--green);position:relative;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow-y:auto}
.code-block .copy-btn{position:absolute;top:8px;right:8px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-dim);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:10px;transition:all var(--transition)}
.code-block .copy-btn:hover{color:var(--accent);border-color:var(--accent)}

/* Command palette overlay */
.cmd-palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
.cmd-palette-overlay.open{display:flex}
.cmd-palette{width:520px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,0.5);overflow:hidden}
.cmd-palette input{width:100%;padding:14px 18px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;outline:none}
.cmd-palette-results{max-height:300px;overflow-y:auto;padding:6px}
.cmd-palette-item{padding:8px 14px;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim)}
.cmd-palette-item:hover,.cmd-palette-item.highlighted{background:rgba(233,69,96,0.12);color:var(--text)}
.cmd-palette-item .shortcut{margin-left:auto;font-size:10px;color:var(--text-muted)}

/* Search input */
.search-input{background:var(--bg-primary);border:1px solid var(--border);border-radius:5px;padding:6px 12px;color:var(--text);font-size:12px;outline:none;transition:border-color var(--transition)}
.search-input:focus{border-color:var(--accent)}

/* Session detail info grid */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.info-item{font-size:12px}.info-item .info-label{color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}

/* Quick actions */
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border)}
.quick-actions .btn{font-size:11px}

/* Responsive */
@media(max-width:1400px){.stats-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}.sidebar.mobile-open{transform:translateX(0)}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" style="position:relative">
      <img src="assets/logo.svg" alt="PhantomShell">
      <span>PhantomShell C2</span>
      <div class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">&#9666;</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="dashboard"><span class="nav-icon">&#9632;</span><span class="nav-label">Dashboard</span></div>
      <div class="nav-item" data-page="sessions"><span class="nav-icon">&#9881;</span><span class="nav-label">Sessions</span></div>
      <div class="nav-item" data-page="listeners"><span class="nav-icon">&#9898;</span><span class="nav-label">Listeners</span></div>
      <div class="nav-item" data-page="builder"><span class="nav-icon">&#9874;</span><span class="nav-label">Builder</span></div>

      <div class="nav-item" data-page="reports"><span class="nav-icon">&#9776;</span><span class="nav-label">Reports</span></div>
      <div class="nav-item" data-page="payloads"><span class="nav-icon">&#9883;</span><span class="nav-label">Payloads</span></div>
      <div class="nav-item" data-page="logs"><span class="nav-icon">&#9783;</span><span class="nav-label">Logs</span></div>
    </nav>

      <span class="conn-dot disconnected" id="conn-status"></span>
      <span id="conn-label">Disconnected</span>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-actions">
        <button onclick="toggleCmdPalette()" title="Command Palette (Ctrl+K)">&#8984; <span class="kbd">Ctrl+K</span></button>
        <button onclick="location.reload()" title="Refresh">&#8635;</button>
        <button title="Operator">&#9673; operator</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Command Palette -->
<div class="cmd-palette-overlay" id="cmd-palette">
  <div class="cmd-palette">
    <input type="text" id="cmd-palette-input" placeholder="Search commands, sessions, actions..." autocomplete="off">
    <div class="cmd-palette-results" id="cmd-palette-results"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE & CONFIG
   ═══════════════════════════════════════════════════════════════ */
const API_BASE = window.location.origin;
const WS_URL = API_BASE;

const state = {
  sessions: [],
  listeners: [],
  credentials: [],
  logs: [],
  timeline: [],
  networkNodes: [],
  networkEdges: [],
  selectedSession: null,
  currentPage: localStorage.getItem('ps_page') || 'dashboard',
  cmdHistory: JSON.parse(localStorage.getItem('ps_cmd_history') || '[]'),
  cmdHistoryIdx: -1
};

/* Demo data for offline/standalone rendering */
function seedDemoData() {
  state.sessions = [
    {id:'sess-1a3f',agent_id:'ag-001',hostname:'web01',ip:'10.10.14.22',username:'www-data',os:'Linux 5.15',agent_type:'python',integrity:'medium',alive:true,last_beacon:Date.now()-12000,transport:'HTTP',encryption:'AES-256-GCM',pid:1842,pending_tasks:2},
    {id:'sess-2b7c',agent_id:'ag-002',hostname:'DC01',ip:'10.10.10.5',username:'CORP\\admin',os:'Windows Server 2022',agent_type:'csharp',integrity:'high',alive:true,last_beacon:Date.now()-5000,transport:'TCP',encryption:'ChaCha20',pid:4120,pending_tasks:0},
    {id:'sess-3d9a',agent_id:'ag-003',hostname:'db-master',ip:'10.10.14.30',username:'postgres',os:'Linux 6.1',agent_type:'python',integrity:'medium',alive:true,last_beacon:Date.now()-45000,transport:'HTTP',encryption:'AES-256-GCM',pid:2901,pending_tasks:1},
    {id:'sess-4e2b',agent_id:'ag-004',hostname:'files01',ip:'10.10.10.12',username:'svc_backup',os:'Windows 10',agent_type:'powershell',integrity:'high',alive:false,last_beacon:Date.now()-3600000,transport:'HTTP',encryption:'AES-256-GCM',pid:0,pending_tasks:0},
    {id:'sess-5f1c',agent_id:'ag-005',hostname:'kali-pivot',ip:'10.10.14.1',username:'root',os:'Linux 6.5',agent_type:'go',integrity:'high',alive:true,last_beacon:Date.now()-2000,transport:'TCP',encryption:'ChaCha20',pid:993,pending_tasks:5},
    {id:'sess-6a8d',agent_id:'ag-006',hostname:'mail01',ip:'10.10.10.25',username:'exchange',os:'Windows Server 2019',agent_type:'csharp',integrity:'medium',alive:true,last_beacon:Date.now()-90000,transport:'HTTP',encryption:'AES-256-GCM',pid:6744,pending_tasks:0},
    {id:'sess-7b0e',agent_id:'ag-007',hostname:'dev-ws',ip:'10.10.14.55',username:'jdoe',os:'Linux 6.2',agent_type:'php',integrity:'low',alive:false,last_beacon:Date.now()-7200000,transport:'HTTP',encryption:'none',pid:0,pending_tasks:0}
  ];
  state.listeners = [
    {id:'lst-01',type:'HTTP',host:'0.0.0.0',port:8443,status:'running',started:Date.now()-86400000},
    {id:'lst-02',type:'TCP',host:'0.0.0.0',port:4444,status:'running',started:Date.now()-43200000},
    {id:'lst-03',type:'HTTPS',host:'0.0.0.0',port:443,status:'stopped',started:null}
  ];
  state.credentials = [
    {source:'steal_creds',type:'plaintext',username:'admin',password:'P@ssw0rd!',host:'DC01',database:''},
    {source:'steal_configs',type:'hash',username:'sa',password:'e10adc3949ba59abbe56e057f20f883e',host:'db-master',database:'mssql'},
    {source:'mimikatz',type:'NTLM',username:'CORP\\svc_sql',password:'aad3b435b51404eeaad3b435b51404ee:8846f7eaee8fb117...',host:'DC01',database:''},
    {source:'steal_configs',type:'API key',username:'aws_key',password:'AKIA...REDACTED',host:'web01',database:''},
    {source:'steal_creds',type:'plaintext',username:'postgres',password:'dbpass123',host:'db-master',database:'appdb'}
  ];

    {time:Date.now()-5000,event:'Agent ag-005 beacon received',type:'info'},
    {time:Date.now()-12000,event:'Task completed on sess-1a3f: sysinfo',type:'success'},
    {time:Date.now()-30000,event:'New credential harvested: admin@DC01',type:'cred'},
    {time:Date.now()-120000,event:'Agent ag-002 connected via TCP',type:'connect'},
    {time:Date.now()-300000,event:'Listener HTTP:8443 started',type:'info'},
    {time:Date.now()-600000,event:'Agent ag-004 disconnected (timeout)',type:'disconnect'},
    {time:Date.now()-900000,event:'Privesc check completed on web01',type:'success'},
    {time:Date.now()-1800000,event:'Payload generated: python/http/aes256',type:'info'}
  ];
  state.networkNodes = [

    {id:'n2',label:'web01',ip:'10.10.14.22',x:300,y:150,status:'compromised',subnet:'14'},
    {id:'n3',label:'db-master',ip:'10.10.14.30',x:300,y:350,status:'compromised',subnet:'14'},

    {id:'n7',label:'mail01',ip:'10.10.10.25',x:900,y:250,status:'compromised',subnet:'10'},

    {from:'n1',to:'n2'},{from:'n1',to:'n3'},{from:'n2',to:'n4'},{from:'n2',to:'n5'},

seedDemoData();

/* ═══════════════════════════════════════════════════════════════
   SOCKET.IO REAL-TIME CONNECTION
   ═══════════════════════════════════════════════════════════════ */
let socket = null;
function initSocket() {
  try {
    socket = io(WS_URL, {reconnection: true, reconnectionDelay: 3000, transports: ['websocket','polling']});
    socket.on('connect', () => {
      document.getElementById('conn-status').className = 'conn-dot connected';
      document.getElementById('conn-label').textContent = 'Connected';
    });
    socket.on('disconnect', () => {
      document.getElementById('conn-status').className = 'conn-dot disconnected';
      document.getElementById('conn-label').textContent = 'Disconnected';
    });
    /* Real-time event handlers for C2 updates */
    socket.on('agent_connected', (data) => {
      const existing = state.sessions.find(s => s.id === data.id);
      if (existing) { Object.assign(existing, data, {alive: true}); }
      else { state.sessions.push({...data, alive: true}); }
      addTimelineEvent('Agent ' + data.agent_id + ' connected', 'connect');
      if (state.currentPage === 'dashboard' || state.currentPage === 'sessions') renderPage();
    });
    socket.on('agent_disconnected', (data) => {
      const s = state.sessions.find(s => s.id === data.id);
      if (s) { s.alive = false; s.last_beacon = Date.now(); }
      addTimelineEvent('Agent ' + (data.agent_id || data.id) + ' disconnected', 'disconnect');
      if (state.currentPage === 'dashboard' || state.currentPage === 'sessions') renderPage();
    });
    socket.on('beacon_update', (data) => {
      const s = state.sessions.find(s => s.id === data.id);
      if (s) { s.last_beacon = Date.now(); s.alive = true; if (data.pending_tasks !== undefined) s.pending_tasks = data.pending_tasks; }
    });
    socket.on('task_response', (data) => {
      addTimelineEvent('Task result on ' + data.session_id + ': ' + (data.command || ''), 'success');
      if (state.selectedSession && state.selectedSession.id === data.session_id) {
        appendTerminalOutput(data.output || data.result || '(no output)', 'output');
      }
    });
    socket.on('new_credential', (data) => {
      state.credentials.push(data);
      addTimelineEvent('Credential harvested: ' + data.username + '@' + data.host, 'cred');
      if (state.currentPage === 'creds') renderPage();
    });
  } catch (e) {
    console.warn('Socket.IO not available, running in standalone mode');
  }
}

function addTimelineEvent(event, type) {
  state.timeline.unshift({time: Date.now(), event, type});
  if (state.timeline.length > 50) state.timeline.pop();
}

function navigate(page) {

function renderPage() {
  const c = document.getElementById('content');
  switch (state.currentPage) {
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'sessions': c.innerHTML = state.selectedSession ? renderSessionDetail() : renderSessions(); break;
    case 'listeners': c.innerHTML = renderListeners(); break;
    case 'builder': c.innerHTML = renderBuilder(); break;
    case 'creds': c.innerHTML = renderCreds(); break;
    case 'network': c.innerHTML = renderNetwork(); setTimeout(initNetworkCanvas, 50); break;
    case 'reports': c.innerHTML = renderReports(); break;
    case 'payloads': c.innerHTML = renderPayloads(); break;
    case 'logs': c.innerHTML = renderLogs(); break;
    default: c.innerHTML = renderDashboard();
  }
}

function timeAgo(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 5) return 'just now';
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}

/* Terminal interaction */
function handleTermKey(e) {
  if (e.key === 'Enter') {
    const input = e.target;
    const cmd = input.value.trim();
    if (!cmd) return;
    state.cmdHistory.unshift(cmd);
    if (state.cmdHistory.length > 100) state.cmdHistory.pop();
    localStorage.setItem('ps_cmd_history', JSON.stringify(state.cmdHistory));
    state.cmdHistoryIdx = -1;
    appendTerminalOutput(cmd, 'cmd');
    input.value = '';
    sendCommand(state.selectedSession.id, cmd);
    simulateResponse(cmd);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (state.cmdHistoryIdx < state.cmdHistory.length - 1) {
      state.cmdHistoryIdx++;
      e.target.value = state.cmdHistory[state.cmdHistoryIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (state.cmdHistoryIdx > 0) {
      state.cmdHistoryIdx--;
      e.target.value = state.cmdHistory[state.cmdHistoryIdx];
    } else {
      state.cmdHistoryIdx = -1;
      e.target.value = '';
    }
  }
}

function appendTerminalOutput(text, type) {
  const out = document.getElementById('term-output');
  if (!out) return;
  const s = state.selectedSession;
  if (type === 'cmd') {
    out.innerHTML += `<span class="prompt-text">${s?s.username+'@'+s.hostname:''}$</span> <span class="cmd">${escHtml(text)}</span>\n`;
  } else if (type === 'error') {
    out.innerHTML += `<span class="error">${escHtml(text)}</span>\n`;
  } else {
    out.innerHTML += escHtml(text) + '\n';
  }
  scrollTerminal();
}

function scrollTerminal() {
  const out = document.getElementById('term-output');
  if (out) out.scrollTop = out.scrollHeight;
}

function quickCmd(cmd) {
  const input = document.getElementById('term-input');
  if (input) { input.value = cmd; input.focus(); handleTermKey({key:'Enter',target:input,preventDefault:()=>{}}); }
}

function sendCommand(sessionId, cmd) {
  if (socket && socket.connected) {
    socket.emit('send_task', {session_id: sessionId, command: cmd});
  } else {
    fetch(API_BASE + '/api/sessions/' + sessionId + '/tasks', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({command: cmd})
    }).catch(() => {});
  }
  addTimelineEvent('Task sent to ' + sessionId + ': ' + cmd, 'info');
}

let forceEnabled = true, netAnimId = null, dragNode = null, netCanvas = null, netCtx = null;

function initNetworkCanvas() {
  netCanvas = document.getElementById('network-canvas');
  if (!netCanvas) return;
  netCtx = netCanvas.getContext('2d');
  const rect = netCanvas.parentElement.getBoundingClientRect();
  netCanvas.width = rect.width;
  netCanvas.height = 500;

  /* Spread initial positions if clustered */
  state.networkNodes.forEach(n => {
    if (!n.vx) { n.vx = 0; n.vy = 0; }
  });

  netCanvas.addEventListener('mousedown', netMouseDown);
  netCanvas.addEventListener('mousemove', netMouseMove);
  netCanvas.addEventListener('mouseup', netMouseUp);
  netCanvas.addEventListener('mouseleave', netMouseUp);

  drawNetwork();
}

/* Force-directed layout simulation */
function drawNetwork() {
  if (!netCtx) return;
  const W = netCanvas.width, H = netCanvas.height;
  netCtx.clearRect(0, 0, W, H);

  if (forceEnabled) applyForces();

  /* Draw edges */
  netCtx.strokeStyle = '#2a2a4a';
  netCtx.lineWidth = 1.5;
  state.networkEdges.forEach(e => {
    const from = state.networkNodes.find(n => n.id === e.from);
    const to = state.networkNodes.find(n => n.id === e.to);
    if (!from || !to) return;
    netCtx.beginPath();
    netCtx.moveTo(from.x, from.y);
    netCtx.lineTo(to.x, to.y);
    netCtx.stroke();
  });

  /* Draw nodes */
  state.networkNodes.forEach(n => {
    const colors = {compromised:'#00ff41', scanned:'#4da6ff', discovered:'#666'};
    const col = colors[n.status] || '#666';
    const r = n === dragNode ? 20 : 16;

    /* Glow */
    netCtx.shadowColor = col;
    netCtx.shadowBlur = n.status === 'compromised' ? 12 : 6;

    netCtx.fillStyle = col;
    netCtx.beginPath();
    netCtx.arc(n.x, n.y, r, 0, Math.PI * 2);
    netCtx.fill();

    netCtx.shadowBlur = 0;

    /* Label */
    netCtx.fillStyle = '#eee';
    netCtx.font = '11px "Segoe UI", sans-serif';
    netCtx.textAlign = 'center';
    netCtx.fillText(n.label, n.x, n.y - r - 6);

    /* IP below */
    netCtx.fillStyle = '#999';
    netCtx.font = '9px monospace';
    netCtx.fillText(n.ip, n.x, n.y + r + 12);
  });

  netAnimId = requestAnimationFrame(drawNetwork);
}

function applyForces() {
  const nodes = state.networkNodes;
  const k = 0.005, repulse = 8000, damping = 0.85;
  /* Repulsion between all pairs */
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      let dx = nodes[j].x - nodes[i].x;
      let dy = nodes[j].y - nodes[i].y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let force = repulse / (dist * dist);
      let fx = (dx / dist) * force;
      let fy = (dy / dist) * force;
      nodes[i].vx -= fx; nodes[i].vy -= fy;
      nodes[j].vx += fx; nodes[j].vy += fy;
    }
  }
  /* Attraction along edges */
  state.networkEdges.forEach(e => {
    const a = nodes.find(n => n.id === e.from);
    const b = nodes.find(n => n.id === e.to);
    if (!a || !b) return;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx*dx + dy*dy) || 1;
    let force = (dist - 120) * k;
    a.vx += (dx / dist) * force;
    a.vy += (dy / dist) * force;
    b.vx -= (dx / dist) * force;
    b.vy -= (dy / dist) * force;
  });
  /* Center gravity */
  const cx = netCanvas.width / 2, cy = netCanvas.height / 2;
  nodes.forEach(n => {
    if (n === dragNode) return;
    n.vx += (cx - n.x) * 0.0005;
    n.vy += (cy - n.y) * 0.0005;
    n.vx *= damping; n.vy *= damping;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(30, Math.min(netCanvas.width - 30, n.x));
    n.y = Math.max(30, Math.min(netCanvas.height - 30, n.y));
  });
}

function netMouseDown(e) {
  const rect = netCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  dragNode = state.networkNodes.find(n => Math.hypot(n.x - mx, n.y - my) < 20) || null;
  if (dragNode) netCanvas.style.cursor = 'grabbing';
}
function netMouseMove(e) {
  if (!dragNode) return;
  const rect = netCanvas.getBoundingClientRect();
  dragNode.x = e.clientX - rect.left;
  dragNode.y = e.clientY - rect.top;
  dragNode.vx = 0; dragNode.vy = 0;
}
function netMouseUp() { dragNode = null; if (netCanvas) netCanvas.style.cursor = 'grab'; }

function resetNetworkLayout() {
  state.networkNodes.forEach((n, i) => {
    const angle = (i / state.networkNodes.length) * Math.PI * 2;
    n.x = netCanvas.width/2 + Math.cos(angle) * 180;
    n.y = netCanvas.height/2 + Math.sin(angle) * 180;
    n.vx = 0; n.vy = 0;
  });
}
function toggleForceLayout() { forceEnabled = !forceEnabled; }

    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   COMMAND PALETTE
   ═══════════════════════════════════════════════════════════════ */
const paletteItems = [
  {label:'Go to Dashboard',action:()=>navigate('dashboard'),shortcut:'Ctrl+1'},
  {label:'Go to Sessions',action:()=>navigate('sessions'),shortcut:'Ctrl+2'},
  {label:'Go to Listeners',action:()=>navigate('listeners'),shortcut:'Ctrl+3'},
  {label:'Go to Agent Builder',action:()=>navigate('builder'),shortcut:'Ctrl+4'},
  {label:'Go to Credentials',action:()=>navigate('creds'),shortcut:'Ctrl+5'},
  {label:'Go to Network Map',action:()=>navigate('network'),shortcut:'Ctrl+6'},
  {label:'Go to Reports',action:()=>navigate('reports'),shortcut:'Ctrl+7'},
  {label:'Start New Listener',action:()=>{navigate('listeners');}},
  {label:'Generate Payload',action:()=>navigate('builder')},
  {label:'Export Credentials CSV',action:()=>exportCredsCSV()},
  {label:'Toggle Sidebar',action:()=>toggleSidebar()},
  {label:'Refresh Data',action:()=>renderPage()},
];

function toggleCmdPalette() {
  const el = document.getElementById('cmd-palette');
  el.classList.toggle('open');
  if (el.classList.contains('open')) {
    const input = document.getElementById('cmd-palette-input');
    input.value = '';
    input.focus();
    renderPaletteResults('');
  }
}

function renderPaletteResults(q) {
  const container = document.getElementById('cmd-palette-results');
  const filtered = q ? paletteItems.filter(i => i.label.toLowerCase().includes(q.toLowerCase())) : paletteItems;
  container.innerHTML = filtered.map((item, i) =>
    `<div class="cmd-palette-item${i===0?' highlighted':''}" onclick="executePaletteItem(${paletteItems.indexOf(item)})">${item.label}${item.shortcut ? '<span class="shortcut">'+item.shortcut+'</span>' : ''}</div>`
  ).join('');
}

function executePaletteItem(idx) {
  paletteItems[idx].action();
  toggleCmdPalette();
}

document.getElementById('cmd-palette-input').addEventListener('input', e => renderPaletteResults(e.target.value));
document.getElementById('cmd-palette-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') toggleCmdPalette();
  if (e.key === 'Enter') {
    const highlighted = document.querySelector('.cmd-palette-item.highlighted');
    if (highlighted) highlighted.click();
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = document.querySelectorAll('.cmd-palette-item');
    let idx = Array.from(items).findIndex(i => i.classList.contains('highlighted'));
    items.forEach(i => i.classList.remove('highlighted'));
    idx = e.key === 'ArrowDown' ? Math.min(idx+1, items.length-1) : Math.max(idx-1, 0);
    if (items[idx]) items[idx].classList.add('highlighted');
  }
});

/* Close palette on backdrop click */
document.getElementById('cmd-palette').addEventListener('click', e => {
  if (e.target === document.getElementById('cmd-palette')) toggleCmdPalette();
});

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR & KEYBOARD SHORTCUTS
   ═══════════════════════════════════════════════════════════════ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
  const arrow = document.getElementById('sidebar-toggle');
  arrow.innerHTML = document.getElementById('sidebar').classList.contains('collapsed') ? '&#9656;' : '&#9666;';
}

document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => navigate(item.dataset.page));
});

/* Show/hide TLS fields based on listener type */
document.addEventListener('change', e => {
  if (e.target.id === 'lst-type') {
    const tls = document.getElementById('tls-fields');
    if (tls) tls.style.display = e.target.value === 'HTTPS' ? 'block' : 'none';
  }
});

/* Global keyboard shortcuts */
document.addEventListener('keydown', e => {
  /* Ctrl+K: command palette */
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); toggleCmdPalette(); }
  /* Ctrl+1 through Ctrl+7: switch sections */
  const pages = ['dashboard','sessions','listeners','builder','creds','network','reports'];
  if (e.ctrlKey && e.key >= '1' && e.key <= '7') { e.preventDefault(); navigate(pages[parseInt(e.key)-1]); }
  /* Ctrl+Enter: send command in terminal */
  if (e.ctrlKey && e.key === 'Enter') {
    const ti = document.getElementById('term-input');
    if (ti && ti.value.trim()) { handleTermKey({key:'Enter',target:ti,preventDefault:()=>{}}); }
  }
  /* Escape: close palette or deselect session */
  if (e.key === 'Escape') {
    const palette = document.getElementById('cmd-palette');
    if (palette.classList.contains('open')) { toggleCmdPalette(); }
    else if (state.selectedSession) { backToSessions(); }
  }
});

/* ═══════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════ */
function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

/* Periodic beacon time refresh */
setInterval(() => {
  document.querySelectorAll('[data-beacon]').forEach(el => {
    el.textContent = timeAgo(parseInt(el.dataset.beacon));
  });
}, 5000);

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  const hash = window.location.hash.slice(1);
  if (hash) state.currentPage = hash;
  navigate(state.currentPage);
  initSocket();
})();
</script>
